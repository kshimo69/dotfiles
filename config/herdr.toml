onboarding = false

# herdr --default-config
[terminal]
new_cwd = "home"

[keys]
prefix = "ctrl+t"
settings = "prefix+,"
split_horizontal = ["prefix+minus", "prefix+s"]
navigate_workspace_up = ["up", "ctrl+k"]
navigate_workspace_down = ["down", "ctrl+j"]

# Custom commands use the same binding syntax.
# type = "shell" runs detached in the background.
# type = "pane" opens a temporary pane and closes it when the command exits.
# [[keys.command]]
# key = "prefix+alt+g"
# type = "pane"
# command = "lazygit"

[ui]
host_cursor = "native"

[ui.toast]
# /mnt/c/Users/N3022/AppData/Roaming/herdr/config.toml
# windowsから herdr --remote wsl-ubuntu で WSL2 の Ubuntu に接続する
# Ubuntu 上も windows 上も両方通知先が system になっている必要がある
# delivery = "herdr"
# delivery = "terminal"
delivery = "system"
delay_seconds = 1
